
name: Build BBS 1.7.10 Forge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -oq bbs-1.7.10-forge-starter.zip -d project

      - name: Patch old ForgeGradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("project").rglob("build.gradle"))
          if not files:
              raise SystemExit("ERROR: build.gradle not found")

          p = files[0]
          s = p.read_text()

          s = s.replace(
              "net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT",
              "com.github.GTNewHorizons:ForgeGradle:1.2.11"
          )

          s = s.replace(
              "repositories {",
              "repositories {\n        maven { url 'https://jitpack.io' }",
              1
          )

          p.write_text(s)
          print("Patched:", p)
          PY

      - name: Build Forge mod
        run: |
          PROJECT_DIR=$(dirname "$(find project -name build.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBS-FS-1.7.10
          path: project/**/build/libs/*.jar
          if-no-files-found: warn
