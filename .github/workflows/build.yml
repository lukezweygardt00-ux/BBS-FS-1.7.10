
name: Build BBS 1.7.10 Forge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Extract project ZIP
        run: |
          unzip -oq bbs-1.7.10-forge-starter.zip -d project
          cd project/bbs-1.7.10-forge-starter
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBS-FS-1.7.10
          path: project/**/build/libs/*.jar
          if-no-files-found: warn
